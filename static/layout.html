<!DOCTYPE html>
<html lang="en" data-theme-default="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f0f7f5" />
  <meta name="color-scheme" content="dark light" />
  <script>(function(){try{var t=localStorage.getItem("webklip-theme");if(t==="light"||t==="dark"){document.documentElement.dataset.theme=t;}else{var d=document.documentElement.dataset.themeDefault;document.documentElement.dataset.theme=d==="light"?"light":"dark";}var th=document.documentElement.dataset.theme;var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",th==="light"?"#f0f7f5":"#071216");}catch(e){}})();</script>
  <meta name="description" content="{{DESCRIPTION}}" />
  <title>{{TITLE}}</title>
  {{CANONICAL}}
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{OG_TITLE}}" />
  <meta property="og:description" content="{{OG_DESCRIPTION}}" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{OG_TITLE}}" />
  <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
  {{JSON_LD}}
  <link rel="manifest" href="{{ASSET_BASE}}/manifest.json" />
  <link rel="icon" href="{{ASSET_BASE}}/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="{{ASSET_BASE}}/icons/icon-192.png" />
  <link rel="stylesheet" href="{{ASSET_BASE}}/app.css" />
  <script src="{{ASSET_BASE}}/app.js" defer></script>
  {{UMAMI}}
</head>
<body class="{{BODY_CLASS}}">
{{HEADER}}
{{BODY}}
{{FOOTER}}
</body>
</html>

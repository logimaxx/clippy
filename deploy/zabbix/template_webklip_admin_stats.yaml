zabbix_export:
  version: '6.0'
  template_groups:
    - uuid: a9a17eb6c4f44f75957ab46930ede280
      name: Templates/Applications
  templates:
    - uuid: 44b1ffba0136484d9fd1c581345eb523
      template: 'Webklip Admin Stats by HTTP'
      name: 'Webklip Admin Stats by HTTP'
      description: |
        Monitors Webklip (clippy) via HTTP Basic–auth admin stats API.
        
        Requires ADMIN_USER and ADMIN_PASSWORD on the Webklip instance.
        
        Macros:
          {$WEBKLIP.URL}           — base URL, e.g. https://webklip.example.com
          {$WEBKLIP.ADMIN.PATH}    — admin mount path (default /admin)
          {$WEBKLIP.ADMIN.USER}    — ADMIN_USER
          {$WEBKLIP.ADMIN.PASSWORD}— ADMIN_PASSWORD
        
        Items scrape GET {$WEBKLIP.URL}{$WEBKLIP.ADMIN.PATH}/api/stats
        and GET {$WEBKLIP.URL}/api/health.
      groups:
        - name: Templates/Applications
      items:
        - uuid: 76fd6ca627a14ea1aa1e0acd38bdb0fa
          name: 'Webklip: Get admin stats'
          type: HTTP_AGENT
          key: webklip.admin.stats
          delay: 1m
          history: 1h
          trends: '0'
          value_type: TEXT
          description: 'Master item. Fetches JSON from /admin/api/stats.'
          timeout: 10s
          url: '{$WEBKLIP.URL}{$WEBKLIP.ADMIN.PATH}/api/stats'
          status_codes: '200'
          authtype: BASIC
          username: '{$WEBKLIP.ADMIN.USER}'
          password: '{$WEBKLIP.ADMIN.PASSWORD}'
          tags:
            - tag: component
              value: admin
            - tag: application
              value: webklip
          triggers:
            - uuid: 059497647db3439eb05c4bf858d09b0c
              expression: 'nodata(/Webklip Admin Stats by HTTP/webklip.admin.stats,5m)=1'
              name: 'Webklip: Admin stats unavailable'
              priority: AVERAGE
              description: 'No successful /admin/api/stats fetch for 5m (auth, path, or service down).'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability

        - uuid: 649fa8d094db4295b0ed562a46d03436
          name: 'Webklip: Get health'
          type: HTTP_AGENT
          key: webklip.health
          delay: 1m
          history: 7d
          trends: '0'
          value_type: TEXT
          description: 'Unauthenticated GET /api/health.'
          timeout: 10s
          url: '{$WEBKLIP.URL}/api/health'
          status_codes: '200'
          tags:
            - tag: component
              value: health
            - tag: application
              value: webklip
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status
          triggers:
            - uuid: 414806c60b574a178be837e514939f79
              expression: 'nodata(/Webklip Admin Stats by HTTP/webklip.health,5m)=1 or last(/Webklip Admin Stats by HTTP/webklip.health)<>"ok"'
              name: 'Webklip: Health check failed'
              priority: HIGH
              description: '/api/health unreachable for 5m or status is not "ok".'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability

        # --- Top-level clip stats ---
        - uuid: ab16f465b4d740269b16b65df1920eb7
